# nginx віддає вебзастосунок і проксує API на gunicorn (сервіс web).
# Файл підключається в контексті http (conf.d офіційного образу nginx).

# Якщо перед nginx стоїть балансувальник з TLS, зберігаємо його X-Forwarded-Proto
# (https), а без нього передаємо власну схему запиту.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /django-admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        alias /var/www/static/;
    }

    # Маршрути React Router: будь-який невідомий шлях повертає index.html.
    location / {
        try_files $uri /index.html;
    }
}
