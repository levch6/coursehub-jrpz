# Локальний запуск усього стеку: nginx, web, worker, beat, redis, postgres.
# Запуск: cp .env.example .env && docker compose up --build
# Лише для локальної розробки: стек працює з config.settings.dev (DEBUG=True,
# ALLOWED_HOSTS=*), тому nginx публікується тільки на 127.0.0.1.

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD у файлі .env (див. .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  web:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      # У slim-образі немає curl, тому перевіряємо /api/health/ засобами Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - static:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  static:
