[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src/backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "DJ"]
ignore = ["S101"]  # assert дозволено в тестах

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"**/migrations/**" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
