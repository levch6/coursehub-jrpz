name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect:
    # Визначає, які модулі вже є в гілці, щоб не запускати перевірки неіснуючого коду.
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scan.outputs.backend }}
      frontend: ${{ steps.scan.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          # Серверну частину перевіряємо, лише коли в гілці вже є Django-проєкт або збирачі:
          # інакше pytest не знаходить тестів і завершується з кодом 5.
          if [ -f src/backend/manage.py ] || [ -d src/backend/collectors ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f src/frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements*.txt
      - run: pip install -r src/backend/requirements-dev.txt
      - name: Лінтер
        run: ruff check .
      - name: Перевірка проєкту Django і міграцій
        run: |
          if [ -f src/backend/manage.py ]; then
            python src/backend/manage.py check --settings=config.settings.test
            python src/backend/manage.py makemigrations --check --dry-run --settings=config.settings.test
          fi
      - name: Тести
        run: pytest

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Перевірка типів
        run: npm run typecheck
      - name: Тести
        run: npm test
      - name: Збірка
        run: npm run build
